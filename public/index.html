<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyTrackshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell hidden" id="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="logo"><span class="logo-dot"></span><span>MyTrackshelf</span></div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="overview" id="nav-overview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-label">Overview</span>
      </button>

      <div class="nav-group open" id="playlists-group">
        <div class="nav-group-header">
          <button class="nav-item" data-view="playlists-toggle" id="nav-playlists-toggle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span class="nav-label">Playlists</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="playlist-list" id="playlist-list"></div>
        <button class="btn-add-playlist" id="btn-new-playlist">+ New Playlist</button>
      </div>

      <button class="nav-item" data-view="favorites" id="nav-favorites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="nav-label">Favorite Songs</span>
      </button>
    </nav>
  </aside>

  <div class="main-column">
    <header class="topbar">
      <div class="topbar-title" id="view-title">Overview</div>
      <div class="account-menu">
        <button class="account-button" id="account-button">?</button>
        <div class="account-dropdown hidden" id="account-dropdown">
          <button id="btn-open-settings">Settings</button>
          <button id="btn-logout">Logout</button>
        </div>
      </div>
    </header>

    <main class="content" id="content">
      <section class="view" id="view-overview">
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" multiple accept=".mp3,.wav,.ogg,.m4a,.flac,audio/*" hidden />
          <p class="upload-title">Drag files here or click to browse</p>
          <p class="upload-hint">MP3, WAV, OGG, M4A, FLAC — max. 50 MB per file</p>
        </div>
        <div class="upload-progress-list" id="upload-progress-list"></div>

        <h2 class="section-heading">Your Songs</h2>
        <div class="track-list" id="track-list-overview"></div>
      </section>

      <section class="view hidden" id="view-playlist">
        <div class="playlist-view-header">
          <h2 id="playlist-view-name">Playlist</h2>
          <div class="playlist-view-actions">
            <button class="btn-ghost" id="btn-playlist-shuffle">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              Shuffle
            </button>
            <button class="btn-ghost" id="btn-rename-playlist">Rename</button>
            <button class="btn-ghost danger" id="btn-delete-playlist">Delete</button>
          </div>
        </div>
        <div class="track-list reorderable" id="track-list-playlist"></div>
      </section>

      <section class="view hidden" id="view-favorites">
        <h2 class="section-heading">Favorite Songs</h2>
        <div class="track-list" id="track-list-favorites"></div>
      </section>
    </main>

    <footer class="player-bar hidden" id="player-bar">
      <div class="player-track-info">
        <div class="player-cover" id="player-cover">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="player-track-text">
          <div class="player-track-title" id="player-title">–</div>
          <div class="player-track-artist" id="player-artist">–</div>
        </div>
        <button class="icon-btn player-favorite-btn" id="player-favorite-btn" aria-label="Favorite">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="icon-btn" id="btn-shuffle" aria-label="Shuffle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button class="icon-btn" id="btn-prev" aria-label="Previous track">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l9-6.5v13z"/></svg>
          </button>
          <button class="icon-btn" id="btn-seek-back" aria-label="Rewind 10 seconds">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
          <button class="player-play-btn" id="btn-play" aria-label="Play/Pause">
            <svg id="icon-play" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="icon-btn" id="btn-seek-fwd" aria-label="Forward 10 seconds">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <button class="icon-btn" id="btn-next" aria-label="Next track">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6.5v13l9-6.5z"/></svg>
          </button>
        </div>
        <div class="player-progress-row">
          <span class="player-time" id="player-current-time">0:00</span>
          <input type="range" class="range-slider" id="progress-slider" min="0" max="1000" value="0" />
          <span class="player-time time-end" id="player-duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <div class="volume-row">
          <button class="icon-btn" id="btn-mute" aria-label="Mute">
            <svg id="icon-vol" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
            <svg id="icon-mute" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/><line x1="17" y1="9" x2="23" y2="15"/><line x1="23" y1="9" x2="17" y2="15"/></svg>
          </button>
          <input type="range" class="range-slider" id="volume-slider" min="0" max="100" value="80" />
        </div>
      </div>
    </footer>
  </div>
</div>

<div class="modal-overlay hidden" id="settings-modal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="form-error hidden" id="settings-error"></div>
    <div class="modal-success hidden" id="settings-success"></div>
    <form id="account-form">
      <div class="field">
        <label for="settings-username">Username</label>
        <input type="text" id="settings-username" minlength="3" required />
      </div>
      <div class="field">
        <label for="settings-email">Email</label>
        <input type="email" id="settings-email" required />
      </div>
      <button type="submit" class="btn-secondary">Save</button>
    </form>

    <div class="modal-section">
      <h3>Change password</h3>
      <div class="form-error hidden" id="password-error"></div>
      <div class="modal-success hidden" id="password-success"></div>
      <form id="password-form">
        <div class="field">
          <label for="current-password">Current password</label>
          <input type="password" id="current-password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn-secondary">Change password</button>
      </form>
    </div>

    <div class="modal-section">
      <div class="danger-zone">
        <p><strong>Delete account</strong> — permanently removes all songs, playlists, and favorites. This cannot be undone.</p>
        <button class="btn-danger" id="btn-delete-account">Delete account</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="btn-close-settings">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="new-playlist-modal">
  <div class="modal">
    <h2>New Playlist</h2>
    <div class="form-error hidden" id="new-playlist-error"></div>
    <form id="new-playlist-form">
      <div class="field">
        <label for="new-playlist-name">Name</label>
        <input type="text" id="new-playlist-name" required />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btn-cancel-new-playlist">Cancel</button>
        <button type="submit" class="btn-primary" style="width:auto;">Create</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
